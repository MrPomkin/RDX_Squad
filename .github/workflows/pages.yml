# Публикация сайта RDX Squad на GitHub Pages через GitHub Actions.
# Включить: Settings → Pages → Source: GitHub Actions. Свой домен: Settings → Pages → Custom domain.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 (закреплено по хешу коммита)
      - name: Собрать папку сайта (без серверного кода)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets img _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0 (закреплено по хешу коммита)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0 (закреплено по хешу коммита)
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1 (закреплено по хешу коммита)
