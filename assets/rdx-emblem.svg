<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RDX Squad">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d53"/><stop offset=".55" stop-color="#2a2c31"/><stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e2470b"/>
    </linearGradient>
    <pattern id="haz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#ff7a1a"/><rect x="14" width="14" height="28" fill="#141518"/>
    </pattern>
    <clipPath id="hexclip"><path d="M256 24 456 140v232L256 488 56 372V140z"/></clipPath>
  </defs>
  <!-- внешний шестигранник с полосами опасности -->
  <path d="M256 8 470 132v248L256 504 42 380V132z" fill="url(#haz)"/>
  <path d="M256 24 456 140v232L256 488 56 372V140z" fill="url(#steel)"/>
  <g clip-path="url(#hexclip)" opacity=".18" stroke="#fff" stroke-width="1">
    <path d="M56 180h400M56 220h400M56 260h400M56 300h400M56 340h400"/>
    <path d="M136 24v464M196 24v464M256 24v464M316 24v464M376 24v464"/>
  </g>
  <!-- внутренний контур -->
  <path d="M256 52 432 154v204L256 460 80 358V154z" fill="none" stroke="#ff7a1a" stroke-width="4" stroke-dasharray="14 8"/>
  <!-- взрыв за буквами -->
  <path d="M256 92l22 64 58-38-26 64 70 6-60 36 46 52-68-14 4 70-46-52-46 52 4-70-68 14 46-52-60-36 70-6-26-64 58 38z" fill="url(#hot)" opacity=".95"/>
  <circle cx="256" cy="236" r="44" fill="#141518"/>
  <circle cx="256" cy="236" r="44" fill="none" stroke="#ffb347" stroke-width="3"/>
  <!-- атом исследовательского отдела -->
  <g fill="none" stroke="#ffb347" stroke-width="3" opacity=".9">
    <ellipse cx="256" cy="236" rx="34" ry="12"/>
    <ellipse cx="256" cy="236" rx="34" ry="12" transform="rotate(60 256 236)"/>
    <ellipse cx="256" cy="236" rx="34" ry="12" transform="rotate(-60 256 236)"/>
  </g>
  <circle cx="256" cy="236" r="6" fill="#ff7a1a"/>
  <!-- надпись RDX -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="400" font-size="118" letter-spacing="6" fill="#141518" transform="translate(5 6)">RDX</text>
    <text x="256" y="400" font-size="118" letter-spacing="6" fill="#f2f2f0">RDX</text>
  </g>
  <rect x="150" y="414" width="212" height="10" fill="url(#haz)"/>
